name: ZhongIOS
options:
  bundleIdPrefix: com.zhong
  deploymentTarget:
    iOS: 18.0
  xcodeVersion: 16.0
  generateEmptyDirectories: true

settings:
  base:
    INFOPLIST_FILE: Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.zhong.app
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  ZhongIOS:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_USER_SCRIPT_SANDBOXING: false
    info:
      path: Resources/Info.plist